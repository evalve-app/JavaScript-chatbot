[project]
name = "studybot-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.4",
    "itsdangerous==2.2.0",
    "kitaru==0.27.2",
    "pgvector==0.5.1",
    "psycopg[binary]==3.3.8",
    "pydantic-ai-slim[openai]==2.66.0",
    "pydantic-settings==2.16.2",
    "python-dotenv==1.2.4",
    "sqlalchemy==2.1.8",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "httpx==0.28.1",
    "pytest==9.2.0",
    "tree-sitter==0.26.1",
    "tree-sitter-javascript==0.25.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
